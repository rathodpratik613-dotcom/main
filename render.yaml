services:
  # Web Service: Backend + Frontend
  - type: web
    name: telemedicine-platform
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && python app.py
    envVars:
      - key: PORT
        value: 5000
      - key: DB_HOST
        value: ${DB_HOST}
      - key: DB_USER
        value: ${DB_USER}
      - key: DB_PASSWORD
        value: ${DB_PASSWORD}
      - key: DB_NAME
        value: ${DB_NAME}
      - key: DB_PORT
        value: ${DB_PORT}
    plan: free

databases:
  # MySQL Database
  - type: mysql
    name: telemedicine-db
    databaseName: telemedicine_db
    user: telemedicine_user
    plan: free
